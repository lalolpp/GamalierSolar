<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="description" content="Monitorización de planta fotovoltaica GamalierSolar" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>GamalierSolar</title>
    <script>
      (function () {
        try {
          fetch("/version.txt", { cache: "no-store" })
            .then(function (r) { return r.text(); })
            .then(function (v) {
              var nv = String(v || "").trim();
              if (!nv) return;
              var prev = localStorage.getItem("gs_build_version");
              if (prev && prev !== nv) {
                localStorage.setItem("gs_build_version", nv);
                location.replace("/?f=" + Date.now());
              } else if (!prev) {
                localStorage.setItem("gs_build_version", nv);
              }
            })
            .catch(function () {});
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
